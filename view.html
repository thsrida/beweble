<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Tool View</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />

<style>
html, body {
margin:0;
padding:0;
width:100%;
height:100%;
overflow:hidden;
background:radial-gradient(circle at top left,#17102a 0%,#08080c 42%),#08080c;
font-family:Nunito Sans,Arial,sans-serif;
color:#fff;
}

/* 🔐 Overlay */
#authOverlay{
position:fixed;
inset:0;
display:flex;
align-items:center;
justify-content:center;
flex-direction:column;
gap:14px;
background:radial-gradient(circle at top left,#17102a 0%,#08080c 45%),#08080c;
color:white;
z-index:9999;
}

.loader-icon{
width:64px;
height:64px;
display:flex;
align-items:center;
justify-content:center;
border-radius:20px;
background:rgba(17,24,39,.72);
border:1px solid rgba(168,85,247,.28);
box-shadow:0 0 28px rgba(168,85,247,.22);
font-size:28px;
color:#00f5ff;
animation:pulse 1.4s infinite;
}

#msg{
font-size:15px;
color:#e5e7eb;
text-align:center;
max-width:300px;
}

#authTitle{
font-size:22px;
font-weight:800;
letter-spacing:.5px;
background:linear-gradient(90deg,#8a2be2,#00f5ff);
-webkit-background-clip:text;
-webkit-text-fill-color:transparent;
}

/* 🔑 password box */
#passBox{
display:flex;
gap:8px;
padding:6px;
border-radius:14px;
background:rgba(17,24,39,.72);
border:1px solid rgba(255,255,255,.07);
backdrop-filter:blur(16px);
}

input{
padding:11px 13px;
border:1px solid rgba(255,255,255,.07);
border-radius:10px;
outline:none;
background:#0b1020;
color:white;
}

button{
padding:10px 14px;
border:1px solid rgba(255,255,255,.08);
border-radius:10px;
cursor:pointer;
background:linear-gradient(135deg,#6366f1,#a855f7);
color:white;
font-weight:700;
}

/* 🖥 fullscreen frame */
#content{
display:none;
width:100vw;
height:100vh;
position:relative;
}

.viewbar{
position:fixed;
top:0;
left:0;
right:0;
height:58px;
display:flex;
align-items:center;
gap:10px;
padding:0 10px;
box-sizing:border-box;
z-index:1000;
background:rgba(8,8,12,.82);
backdrop-filter:blur(18px);
-webkit-backdrop-filter:blur(18px);
border-bottom:1px solid rgba(255,255,255,.07);
box-shadow:0 8px 25px rgba(0,0,0,.35);
}

.back-tools{
width:42px;
height:42px;
padding:0;
display:flex;
align-items:center;
justify-content:center;
border-radius:13px;
background:rgba(17,24,39,.65);
border:1px solid rgba(255,255,255,.07);
color:#fff;
font-size:18px;
transition:.25s ease;
}

.back-tools:hover{
transform:translateY(-2px) scale(1.04);
border-color:rgba(168,85,247,.55);
box-shadow:0 0 16px rgba(168,85,247,.3);
}

.view-title{
font-size:14px;
font-weight:700;
color:#e5e7eb;
overflow:hidden;
text-overflow:ellipsis;
white-space:nowrap;
}

.view-title span{
display:block;
font-size:11px;
font-weight:500;
color:#71717a;
margin-top:2px;
}

iframe{
position:absolute;
top:58px;
left:0;
width:100%;
height:calc(100% - 58px);
border:none;
background:white;
}

@keyframes pulse{
0%,100%{transform:scale(1);opacity:1}
50%{transform:scale(1.08);opacity:.78}
}
</style>
</head>

<body>

<!-- 🔐 LOCK SCREEN -->
<div id="authOverlay">
<div class="loader-icon"><i class="fa-solid fa-bolt"></i></div>
<div id="authTitle">Beweble</div>
<div id="msg">Loading...</div>

<div id="passBox" style="display:none;">
<input id="passInput" type="password" placeholder="Enter password">
<button onclick="checkPass()">Enter</button>
</div>
</div>

<!-- 🖥 TOOL -->
<div id="content">
<div class="viewbar">
<button class="back-tools" type="button" onclick="location.href='tools.html'" aria-label="Back to Tools">
<i class="fa-solid fa-angle-left"></i>
</button>
<div class="view-title">
Tool Preview
<span>Beweble Tools</span>
</div>
</div>
<iframe id="frame"></iframe>
</div>

<script type="module">

import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js";
import { getAuth, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-auth.js";
import { getFirestore, doc, getDoc } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore.js";

const firebaseConfig = {
    apiKey: "AIzaSyCjmJBV_GKL4MLYQGr3DWOOAWwK4V8AHtU",
    authDomain: "beweble.firebaseapp.com",
    projectId: "beweble",
    storageBucket: "beweble.firebasestorage.app",
    messagingSenderId: "184003889465",
    appId: "1:184003889465:web:6426d12aca892d95c600e8"
};

const app = initializeApp(firebaseConfig);
const auth = getAuth(app);
const db = getFirestore(app);

const id = new URLSearchParams(location.search).get("id");

let tool = null;

const overlay = document.getElementById("authOverlay");
const msg = document.getElementById("msg");
const passBox = document.getElementById("passBox");

onAuthStateChanged(auth, async (user) => {

if (!user) {
location.href = "index.html";
return;
}

if (!id) {
msg.innerText = "No tool ID";
return;
}

const snap = await getDoc(doc(db, "tools", id));

if (!snap.exists()) {
msg.innerText = "Tool not found";
return;
}

tool = snap.data();

// 🔐 PRIVATE
if (tool.visibility === "private") {
msg.innerText = "Enter password to continue";
passBox.style.display = "flex";
return;
}

// ✔ PUBLIC
showTool();

});

window.checkPass = function(){

const val = document.getElementById("passInput").value;

if (val !== tool.password) {
alert("Wrong password");
return;
}

showTool();
};

function showTool(){

overlay.style.display = "none";
document.getElementById("content").style.display = "block";

const frame = document.getElementById("frame");
const docFrame = frame.contentDocument || frame.contentWindow.document;

docFrame.open();
docFrame.write(`
<!DOCTYPE html>
<html>
<head>
<style>${tool.css || ""}</style>
</head>
<body>
${tool.html || ""}
<script>${tool.js || ""}<\/script>
</body>
</html>
`);
docFrame.close();

}

</script>

</body>
</html>
